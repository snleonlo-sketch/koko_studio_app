name: koko_studio_app

description: Koko Studio App

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  firebase_storage: ^12.3.3

  provider: ^6.1.2
  awesome_dialog: ^3.2.1
  url_launcher: ^6.3.1
  intl: ^0.19.0
  pdf: ^3.11.1
  printing: ^5.13.4
  fl_chart: ^0.69.0
  image_picker: ^1.1.2
  table_calendar: ^3.1.2
  flutter_local_notifications: ^17.2.2
  timezone: ^0.9.4
  excel: ^4.0.3
  path_provider: ^2.1.4
  share_plus: ^10.0.2
  shared_preferences: ^2.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^4.0.0

flutter:

  uses-material-design: true

  assets:
    - assets/
    - assets/images/
    - assets/images/logo_koko.jpg
    - assets/images/yape.jpeg

